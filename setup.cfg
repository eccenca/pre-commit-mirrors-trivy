[metadata]
name = trivy-py-ecc
version = 0.73.0.1
description = Python wrapper around invoking trivy (https://trivy.dev/)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/eccenca/pre-commit-mirrors-trivy
author = eccenca GmbH
author_email = cmempy-developer@eccenca.com
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
	Programming Language :: Python :: Implementation :: PyPy

[options]
python_requires = >=3.9
setup_requires =
    setuptools-download

[setuptools_download]
download_scripts =
    [trivy]
    group = trivy-binary
    marker = sys_platform == "linux" and platform_machine == "x86_64"
    url = https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-64bit.tar.gz
    sha256 = 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
    extract = tar
    extract_path = trivy

    [trivy]
    group = trivy-binary
    marker = sys_platform == "linux" and platform_machine == "aarch64"
    url = https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-ARM64.tar.gz
    sha256 = 13833d97e8a1a5367471c372a173180157f593bece570e20d5d925fef552f5dd
    extract = tar
    extract_path = trivy

    [trivy]
    group = trivy-binary
    marker = sys_platform == "linux" and platform_machine == "armv7l"
    url = https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-ARM.tar.gz
    sha256 = 8d0baaa79259a81b87611e50ceada2a3a3daf317e8bfc57bad166cc1877d761b
    extract = tar
    extract_path = trivy

    [trivy]
    group = trivy-binary
    marker = sys_platform == "darwin" and platform_machine == "arm64"
    url = https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_macOS-ARM64.tar.gz
    sha256 = 80cc25faaf6378e37701202d0b4f9f43d9e413d198d594ba60fdf559fe44a683
    extract = tar
    extract_path = trivy

    [trivy]
    group = trivy-binary
    marker = sys_platform == "darwin" and platform_machine == "x86_64"
    url = https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_macOS-64bit.tar.gz
    sha256 = d39d1374dd3e35d48621b82df9b6625fe69f9920cc67d2739ed81bb679f16f51
    extract = tar
    extract_path = trivy

    [trivy.exe]
    group = trivy-binary
    marker = sys_platform == "win32" and platform_machine == "AMD64"
    marker = sys_platform == "cygwin" and platform_machine == "x86_64"
    url = https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_windows-64bit.zip
    sha256 = d2d3ad5292aae470a03eb6506db86fce81b1894592b8451cadaf60eaa22f2025
    extract = zip
    extract_path = trivy.exe
